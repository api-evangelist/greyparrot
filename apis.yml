aid: greyparrot
name: Greyparrot
description: >-
  Greyparrot is a London-based AI waste analytics company that turns materials
  recovery facilities (MRFs) into data-driven operations. Its Greyparrot
  Analyzer uses computer-vision cameras mounted over waste conveyor belts to
  identify, count, and measure the composition of waste streams in real time,
  giving recyclers continuous visibility into what flows through their plant.
  The Greyparrot Sync product routes that analytics stream into existing
  operational control systems, ERP platforms, Power BI dashboards, and OEM
  sortation hardware (robotic arms, air-jet systems, balers, belt control),
  while Deepnest turns real-world recovery data into design feedback for
  packaging brands. Backed by Speedinvest, Greyparrot serves recyclers,
  equipment manufacturers, and consumer-goods companies working to raise
  recycling rates and automate compliance reporting. The company does not
  currently publish a public developer API, SDKs, or OpenAPI definition; this
  profile captures its public web, product, and content surface.
